server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo

# TraceQL metrics (rate/quantile over spans) power The Agent dashboard —
# the local-blocks processor is what turns raw spans into queryable series.
# NOTE: Tempo 2.5 syntax — the generator needs its storage blocks to join the
# ring, and processor activation uses the legacy overrides key (the nested
# `defaults:` form only exists from 2.6).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write: []
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false

overrides:
  metrics_generator_processors: [local-blocks]
