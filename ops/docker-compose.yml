name: genesis-ops
# Local Grafana observability stack for Genesis OS — Operational Intelligence.
#   docker compose up -d
# Grafana UI:        http://localhost:3001  (admin / genesis)
# Grafana MCP:       http://localhost:8686/mcp   ← set GRAFANA_MCP_URL to this
# Simulator control: http://localhost:9105
# (Grafana Cloud swap: point GRAFANA_MCP_URL at the hosted Cloud MCP endpoint + token.)
services:
  simulator:
    build: ../simulator
    ports: ["9105:9105"]
    environment:
      LOKI_URL: http://loki:3100
      TIME_SCALE: "10"   # demo pacing: incident matures in ~3 min (set 1 for real time)
      SITE: local        # farm identity label (hosted farm uses site=cloudrun)
      # Grafana Cloud mirroring (values from ops/.env; empty = local-only)
      GC_PROM_RW_URL: ${GC_PROM_RW_URL:-}
      GC_PROM_USER: ${GC_PROM_USER:-}
      GC_LOKI_PUSH_URL: ${GC_LOKI_PUSH_URL:-}
      GC_LOKI_USER: ${GC_LOKI_USER:-}
      GC_TOKEN: ${GC_TOKEN:-}
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [simulator]

  loki:
    image: grafana/loki:3.1.0
    ports: ["3100:3100"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: genesis_ops
    ports: ["5434:5432"]
    volumes:
      - pgdata_ops:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports: ["4224:4222"]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: genesis
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]

  # PostgreSQL: durable investigation/incident state (localhost:5434)
  # NATS: operational event fabric, genesis.ops.events (localhost:4224)

  mcp-grafana:
    # Official Grafana MCP server. Targets the Grafana Cloud stack when
    # MCP_TARGET_GRAFANA_URL + GRAFANA_SA_TOKEN are set in ops/.env;
    # falls back to the local Grafana container otherwise.
    image: mcp/grafana:latest
    command: ["-t", "streamable-http", "-address", "0.0.0.0:8000",
              "-allowed-hosts", "localhost:8686,127.0.0.1:8686,localhost:8000,127.0.0.1:8000,mcp-grafana:8000"]
    environment:
      GRAFANA_URL: ${MCP_TARGET_GRAFANA_URL:-http://grafana:3000}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SA_TOKEN:-}
      # basic-auth fallback for the local stack; leave MCP_GRAFANA_USERNAME empty in
      # ops/.env when targeting Grafana Cloud (the service-account token wins)
      GRAFANA_USERNAME: ${MCP_GRAFANA_USERNAME-admin}
      GRAFANA_PASSWORD: ${MCP_GRAFANA_PASSWORD-genesis}
    ports: ["8686:8000"]
    depends_on: [grafana]

volumes:
  pgdata_ops:
