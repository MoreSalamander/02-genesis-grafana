[project]
name = "genesis-grafana"
version = "0.1.0"
description = "Genesis OS — Operational Intelligence. Standalone operational-cognition system (Grafana track, Google Cloud Agentic Cinema Hackathon)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "mcp>=1.9",
    "acryl-datahub>=1.0",
    "psycopg[binary]>=3.2",
    "nats-py>=2.7",
    "temporalio>=1.7",
    "redis>=5.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
